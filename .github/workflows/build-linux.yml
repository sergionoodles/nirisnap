name: Build Linux

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  archlinux:
    name: Arch Linux x86_64
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install build and runtime dependencies
        run: >-
          pacman -Syu --noconfirm --needed
          base-devel cmake ninja pkgconf qt6-base qt6-wayland layer-shell-qt
          wayland wayland-protocols wl-clipboard tesseract tesseract-data-eng
          niri libnotify clang

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build, run interaction smoke, and analyze sources
        env:
          QT_QPA_PLATFORM: offscreen
        run: make check

      - name: Stage installation
        run: cmake --install build --prefix "$PWD/stage/usr"

      - name: Verify staged install
        run: |
          test -x stage/usr/bin/nirisnap
          test -f stage/usr/share/applications/nirisnap.desktop
          test -f stage/usr/share/licenses/nirisnap/Neucha-OFL.txt
          test -f stage/usr/share/licenses/nirisnap/JetBrainsMono-OFL.txt
          test -f stage/usr/share/licenses/nirisnap/Inter-OFL.txt

      - name: Package Linux artifact
        run: |
          version="$(QT_QPA_PLATFORM=offscreen ./build/nirisnap --version | cut -d' ' -f2)"
          archive="nirisnap-${version}-archlinux-x86_64.tar.gz"
          echo "CAPTURE_ARCHIVE=${archive}" >> "$GITHUB_ENV"
          echo "CAPTURE_ARTIFACT=${archive%.tar.gz}" >> "$GITHUB_ENV"
          tar -C stage -czf "$archive" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CAPTURE_ARTIFACT }}
          path: ${{ env.CAPTURE_ARCHIVE }}
          if-no-files-found: error

      - name: Attach artifact to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.CAPTURE_ARCHIVE }}
